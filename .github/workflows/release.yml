name: Create Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-installers:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact-suffix: linux
          - os: windows-latest
            artifact-suffix: windows
          - os: macos-latest
            artifact-suffix: macos

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR with jpackage
        run: |
          mvn clean package -DskipTests
          mkdir -p target/installer
          
          # Get version from tag
          VERSION=${GITHUB_REF_NAME#v}
          
          # Determine jpackage installer type based on OS
          if [ "$RUNNER_OS" = "Windows" ]; then
            jpackage --input target/jpackage-input --name SmartCLI --main-jar SmartCLI-${VERSION}.jar --main-class com.lpu.smartcli.ui.Terminal --app-version ${VERSION} --vendor "LPU CAP477" --win-console --dest target/installer --type exe || echo "jpackage failed on Windows"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            jpackage --input target/jpackage-input --name SmartCLI --main-jar SmartCLI-${VERSION}.jar --main-class com.lpu.smartcli.ui.Terminal --app-version ${VERSION} --vendor "LPU CAP477" --dest target/installer --type deb || echo "jpackage failed on Linux"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            jpackage --input target/jpackage-input --name SmartCLI --main-jar SmartCLI-${VERSION}.jar --main-class com.lpu.smartcli.ui.Terminal --app-version ${VERSION} --vendor "LPU CAP477" --dest target/installer --type dmg || echo "jpackage failed on macOS"
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartCLI-${{ matrix.artifact-suffix }}
          path: |
            target/installer/*
            target/SmartCLI.jar
            target/SmartCLI-*.jar

  publish-release:
    runs-on: ubuntu-latest
    needs: build-installers
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
