name: Create Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-installers:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact-suffix: linux
          - os: windows-latest
            artifact-suffix: windows
          - os: macos-latest
            artifact-suffix: macos

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR with jpackage
        run: |
          mvn clean package -DskipTests
          mkdir -p target/installer
          
          # Get version from tag
          VERSION=${GITHUB_REF_NAME#v}
          
          # Determine jpackage installer type based on OS
          if [ "$RUNNER_OS" = "Windows" ]; then
            jpackage --input target/jpackage-input --name SmartCLI --main-jar SmartCLI-${VERSION}.jar --main-class com.lpu.smartcli.ui.Terminal --app-version ${VERSION} --vendor "LPU CAP477" --win-console --dest target/installer --type exe || echo "jpackage failed on Windows"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            jpackage --input target/jpackage-input --name SmartCLI --main-jar SmartCLI-${VERSION}.jar --main-class com.lpu.smartcli.ui.Terminal --app-version ${VERSION} --vendor "LPU CAP477" --dest target/installer --type deb || echo "jpackage failed on Linux"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            jpackage --input target/jpackage-input --name SmartCLI --main-jar SmartCLI-${VERSION}.jar --main-class com.lpu.smartcli.ui.Terminal --app-version ${VERSION} --vendor "LPU CAP477" --dest target/installer --type dmg || echo "jpackage failed on macOS"
          fi
        shell: bash

      - name: Prepare release assets
        run: |
          mkdir -p target/release-bundle
          VERSION=${GITHUB_REF_NAME#v}

          # Add per-platform JAR to avoid duplicate release asset names.
          if [ -f "target/SmartCLI-${VERSION}.jar" ]; then
            cp "target/SmartCLI-${VERSION}.jar" "target/release-bundle/SmartCLI-${VERSION}-${{ matrix.artifact-suffix }}.jar"
          fi

          # Normalize installer names to include platform suffix.
          shopt -s nullglob
          for file in target/installer/*; do
            base="$(basename "$file")"
            if [[ "$base" == *.* ]]; then
              name="${base%.*}"
              ext="${base##*.}"
              cp "$file" "target/release-bundle/${name}-${{ matrix.artifact-suffix }}.${ext}"
            else
              cp "$file" "target/release-bundle/${base}-${{ matrix.artifact-suffix }}"
            fi
          done
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: SmartCLI-${{ matrix.artifact-suffix }}
          path: target/release-bundle/*
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    runs-on: ubuntu-latest
    needs: build-installers
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: List artifacts
        run: find release-assets -type f

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SmartCLI ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Automated release for `${{ github.ref_name }}`.
            Includes cross-platform installers and platform-tagged JAR artifacts.
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          files: release-assets/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false
