name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact-suffix: linux
          - os: windows-latest
            artifact-suffix: windows
          - os: macos-latest
            artifact-suffix: macos
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build JAR
      run: mvn clean package -DskipTests
    
    - name: Create Installer (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir -p target\jpackage-input
        copy target\SmartCLI.jar target\jpackage-input\
        jpackage --input target/jpackage-input --name SmartCLI --main-jar SmartCLI.jar --main-class com.lpu.smartcli.ui.Terminal --app-version ${{ github.ref_name }} --vendor "LPU CAP477" --win-console --dest target/installer --type exe
      shell: cmd
    
    - name: Create Installer (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p target/jpackage-input
        cp target/SmartCLI.jar target/jpackage-input/
        jpackage --input target/jpackage-input --name SmartCLI --main-jar SmartCLI.jar --main-class com.lpu.smartcli.ui.Terminal --app-version ${{ github.ref_name }} --vendor "LPU CAP477" --dest target/installer --type deb
    
    - name: Create Installer (macOS)
      if: runner.os == 'macOS'
      run: |
        mkdir -p target/jpackage-input
        cp target/SmartCLI.jar target/jpackage-input/
        jpackage --input target/jpackage-input --name SmartCLI --main-jar SmartCLI.jar --main-class com.lpu.smartcli.ui.Terminal --app-version ${{ github.ref_name }} --vendor "LPU CAP477" --dest target/installer --type dmg
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SmartCLI-${{ matrix.artifact-suffix }}
        path: target/installer/
    
    - name: Create GitHub Release
      if: matrix.os == 'ubuntu-latest'
      uses: softprops/action-gh-release@v1
      with:
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        files: |
          target/SmartCLI.jar
          target/installer/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
