name: Cross-Platform Build

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java-version: ['17', '21']
    
    name: Build on ${{ matrix.os }} - Java ${{ matrix.java-version }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package
    
    - name: Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-java${{ matrix.java-version }}
        path: target/surefire-reports/
        retention-days: 7
    
    - name: Build Success Log
      run: |
        echo "✅ Build succeeded on ${{ matrix.os }} with Java ${{ matrix.java-version }}"
        echo "📦 JAR size: $(du -h target/SmartCLI.jar | cut -f1)" || echo "✅ Build completed"
