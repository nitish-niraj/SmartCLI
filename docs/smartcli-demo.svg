<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" role="img" aria-label="SmartCLI animated full terminal demo">
  <style>
    .bg { fill: #0f172a; }
    .bar { fill: #1e293b; }
    .dot1 { fill: #ef4444; }
    .dot2 { fill: #f59e0b; }
    .dot3 { fill: #22c55e; }
    .title { fill: #dbeafe; font: 600 15px Consolas, monospace; }
    .prompt { fill: #93c5fd; font: 16px Consolas, monospace; }
    .cmd { fill: #e5e7eb; font: 16px Consolas, monospace; }
    .ok { fill: #86efac; font: 16px Consolas, monospace; }
    .warn { fill: #fcd34d; font: 16px Consolas, monospace; }
    .err { fill: #fca5a5; font: 16px Consolas, monospace; }
    .dim { fill: #9ca3af; font: 15px Consolas, monospace; }
    .small { fill: #cbd5e1; font: 14px Consolas, monospace; }
    .frame { opacity: 0; animation: frame 24s infinite; }
    .f1 { animation-delay: 0s; }
    .f2 { animation-delay: 4s; }
    .f3 { animation-delay: 8s; }
    .f4 { animation-delay: 12s; }
    .f5 { animation-delay: 16s; }
    .f6 { animation-delay: 20s; }
    @keyframes frame {
      0%, 4% { opacity: 0; transform: translateY(8px); }
      7%, 15% { opacity: 1; transform: translateY(0); }
      18%, 100% { opacity: 0; transform: translateY(0); }
    }
  </style>

  <rect class="bg" x="0" y="0" width="980" height="720" rx="16"/>
  <rect class="bar" x="0" y="0" width="980" height="46" rx="16"/>
  <circle class="dot1" cx="24" cy="23" r="7"/>
  <circle class="dot2" cx="48" cy="23" r="7"/>
  <circle class="dot3" cx="72" cy="23" r="7"/>
  <text class="title" x="108" y="29">SmartCLI v1.0 - full build and viva demo</text>

  <g class="frame f1">
    <text class="prompt" x="34" y="86">PS E:\lpu semester 2\java\SmartCLI&gt;</text>
    <text class="cmd" x="34" y="116">.\.tools\apache-maven-3.9.9\bin\mvn.cmd clean package -DskipTests</text>
    <text class="small" x="34" y="154">[INFO] Building SmartCLI 1.0.0</text>
    <text class="small" x="34" y="184">[INFO] Compiling 51 source files with javac [target 17]</text>
    <text class="warn" x="34" y="214">[WARNING] system modules path not set in conjunction with -source 17</text>
    <text class="small" x="34" y="244">[INFO] Building jar: E:\lpu semester 2\java\SmartCLI\target\SmartCLI.jar</text>
    <text class="ok" x="34" y="274">[INFO] BUILD SUCCESS</text>
    <text class="dim" x="34" y="326">The runnable JAR is compiled before launching the CLI.</text>
  </g>

  <g class="frame f2">
    <text class="prompt" x="34" y="86">PS E:\lpu semester 2\java\SmartCLI&gt;</text>
    <text class="cmd" x="34" y="116">cmd.exe /c "chcp 65001 &amp; java -Dfile.encoding=UTF-8 -jar target\SmartCLI.jar"</text>
    <text class="small" x="34" y="156">Active code page: 65001</text>
    <text class="ok" x="34" y="202">╔══════════════════════════════════════╗</text>
    <text class="ok" x="34" y="232">║   Smart Command Line System v1.0     ║</text>
    <text class="ok" x="34" y="262">║   LPU | CAP477 | Section D2526       ║</text>
    <text class="ok" x="34" y="292">╚══════════════════════════════════════╝</text>
    <text class="small" x="34" y="334">Type 'help' to see all commands. Type 'exit' to quit.</text>
    <text class="dim" x="34" y="386">Unicode output is enabled for the banner and terminal UI.</text>
  </g>

  <g class="frame f3">
    <text class="prompt" x="34" y="86">smartcli&gt; dir</text>
    <text class="small" x="34" y="116">Directory of E:\lpu semester 2\java\SmartCLI</text>
    <text class="small" x="34" y="146">.gitignore   pom.xml   README.md   src   target</text>
    <text class="ok" x="34" y="176">OS command exited with code: 0</text>
    <text class="prompt" x="34" y="222">smartcli&gt; ls</text>
    <text class="err" x="34" y="252">'ls' is not recognized as an internal or external command</text>
    <text class="ok" x="34" y="282">OS command exited with code: 1</text>
    <text class="prompt" x="34" y="328">smartcli&gt; mkdir javatest</text>
    <text class="ok" x="34" y="358">OS command exited with code: 0</text>
    <text class="dim" x="34" y="410">Unknown commands pass through to Windows cmd.exe safely.</text>
  </g>

  <g class="frame f4">
    <text class="prompt" x="34" y="86">smartcli&gt; cd ..</text>
    <text class="ok" x="34" y="116">Working directory changed to: E:\lpu semester 2\java</text>
    <text class="prompt" x="34" y="162">smartcli&gt; cd ..</text>
    <text class="ok" x="34" y="192">Working directory changed to: E:\lpu semester 2</text>
    <text class="prompt" x="34" y="238">smartcli&gt; cd javatest</text>
    <text class="ok" x="34" y="268">Working directory changed to: E:\lpu semester 2\javatest</text>
    <text class="prompt" x="34" y="314">smartcli&gt; list</text>
    <text class="small" x="34" y="344">No files found.</text>
    <text class="prompt" x="34" y="390">smartcli&gt; dir</text>
    <text class="small" x="34" y="420">Directory of E:\lpu semester 2\javatest</text>
    <text class="dim" x="34" y="472">SmartCLI cd changes the directory used by both built-ins and OS commands.</text>
  </g>

  <g class="frame f5">
    <text class="prompt" x="34" y="86">smartcli&gt; create hello.java</text>
    <text class="ok" x="34" y="116">File 'hello.java' created at E:\lpu semester 2\javatest\hello.java</text>
    <text class="prompt" x="34" y="162">smartcli&gt; write hello.java this is the testing file</text>
    <text class="ok" x="34" y="192">Written to 'E:\lpu semester 2\javatest\hello.java'.</text>
    <text class="prompt" x="34" y="238">smartcli&gt; read hello.java</text>
    <text class="small" x="34" y="268">--- hello.java ---</text>
    <text class="small" x="34" y="298">this is the testing file</text>
    <text class="small" x="34" y="328">-----------------</text>
    <text class="dim" x="34" y="380">create, write, and read now operate on real disk files.</text>
  </g>

  <g class="frame f6">
    <text class="prompt" x="34" y="86">smartcli&gt; create a python file with name niraj.py</text>
    <text class="ok" x="34" y="116">[AI] Interpreted as: create niraj.py</text>
    <text class="ok" x="34" y="146">File 'niraj.py' created at E:\lpu semester 2\javatest\niraj.py</text>
    <text class="prompt" x="34" y="192">smartcli&gt; list</text>
    <text class="small" x="34" y="222">Files in E:\lpu semester 2\javatest:</text>
    <text class="small" x="54" y="252">* hello.java</text>
    <text class="small" x="54" y="282">* niraj.py</text>
    <text class="prompt" x="34" y="328">smartcli&gt; exit</text>
    <text class="ok" x="34" y="358">Exiting Smart CLI. Goodbye!</text>
    <text class="dim" x="34" y="410">AI commands, real files, and Windows Explorer now tell the same story.</text>
  </g>
</svg>
